apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cstad-devops
  labels:
    app: cstad-backend
data:
  SERVER_PORT: "8080"
  APP_ENV: "production"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "cstad_devops"
  CORS_ALLOWED_ORIGINS: "https://app.devops.cstad.edu.kh,http://localhost:3000"

