replicaCount: 3
environment: prod

service:
  type: NodePort
  nodePort: 30081

config:
  APP_ENV: "production"
  DB_HOST: "postgres-service"
  DB_NAME: "cstad_devops"
  CORS_ALLOWED_ORIGINS: "https://app.devops.cstad.edu.kh"

ingress:
  enabled: true
  host: api.devops.cstad.edu.kh
  tlsSecretName: cstad-backend-tls
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

